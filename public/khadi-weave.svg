<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- warp threads (vertical), slight irregular spacing -->
  <rect x="0" y="0" width="1.2" height="24" fill="#8a6a3a" opacity="0.07"/>
  <rect x="1.2" y="0" width="1" height="24" fill="#fdf8ea" opacity="0.22"/>
  <rect x="11.6" y="0" width="1.2" height="24" fill="#8a6a3a" opacity="0.07"/>
  <rect x="12.8" y="0" width="1" height="24" fill="#fdf8ea" opacity="0.22"/>
  <!-- weft threads (horizontal) -->
  <rect x="0" y="0" width="24" height="1.2" fill="#8a6a3a" opacity="0.07"/>
  <rect x="0" y="1.2" width="24" height="1" fill="#fdf8ea" opacity="0.22"/>
  <rect x="0" y="11.6" width="24" height="1.2" fill="#8a6a3a" opacity="0.07"/>
  <rect x="0" y="12.8" width="24" height="1" fill="#fdf8ea" opacity="0.22"/>
  <!-- hand-woven slubs and fiber irregularity -->
  <rect x="5" y="17.5" width="5" height="1.1" fill="#8a6a3a" opacity="0.06"/>
  <rect x="16" y="5" width="1.1" height="4.5" fill="#8a6a3a" opacity="0.06"/>
  <rect x="19" y="20" width="3" height="0.9" fill="#f7f0dc" opacity="0.30"/>
</svg>
