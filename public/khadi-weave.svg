<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- fine warp threads -->
  <rect x="0" y="0" width="1" height="16" fill="#8a6a3a" opacity="0.05"/>
  <rect x="8" y="0" width="1" height="16" fill="#8a6a3a" opacity="0.05"/>
  <!-- fine weft threads -->
  <rect x="0" y="0" width="16" height="1" fill="#8a6a3a" opacity="0.05"/>
  <rect x="0" y="8" width="16" height="1" fill="#8a6a3a" opacity="0.05"/>
  <!-- soft thread highlights -->
  <rect x="1" y="1" width="1" height="16" fill="#fdf8ea" opacity="0.25"/>
  <rect x="1" y="1" width="16" height="1" fill="#fdf8ea" opacity="0.25"/>
  <!-- occasional fiber slub -->
  <rect x="5" y="12" width="4" height="1" fill="#8a6a3a" opacity="0.04"/>
  <rect x="12" y="4" width="1" height="4" fill="#8a6a3a" opacity="0.04"/>
</svg>
