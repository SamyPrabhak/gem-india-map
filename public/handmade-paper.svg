<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <defs>
    <!-- fine grain, tileable -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.36
                0 0 0 0 0.20
                0 0 0 0.05 0"/>
    </filter>
    <!-- soft tonal mottling, tileable -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" stitchTiles="stitch" result="m"/>
      <feColorMatrix in="m" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.33
                0 0 0 0 0.18
                0 0 0 0.045 0"/>
    </filter>
  </defs>

  <!-- warm mottled deckle tone -->
  <rect width="300" height="300" filter="url(#mottle)"/>
  <!-- speckled fiber grain -->
  <rect width="300" height="300" filter="url(#grain)"/>

  <!-- stray pulp fibers -->
  <g stroke="#7a5230" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.09">
    <path d="M18 42 q14 -6 27 2"/>
    <path d="M132 18 q10 8 24 4"/>
    <path d="M236 66 q-12 6 -22 0"/>
    <path d="M64 128 q12 8 26 3"/>
    <path d="M188 140 q-8 10 -20 8"/>
    <path d="M272 132 q10 -8 22 -3"/>
    <path d="M30 224 q14 -5 26 3"/>
    <path d="M148 214 q-10 8 -24 5"/>
    <path d="M228 246 q12 -7 25 -1"/>
    <path d="M92 272 q10 7 23 3"/>
  </g>

  <!-- tiny embedded flecks -->
  <g fill="#7a5230" opacity="0.10">
    <circle cx="48" cy="84" r="0.8"/>
    <circle cx="160" cy="52" r="0.7"/>
    <circle cx="254" cy="104" r="0.9"/>
    <circle cx="88" cy="168" r="0.7"/>
    <circle cx="206" cy="182" r="0.8"/>
    <circle cx="28" cy="258" r="0.7"/>
    <circle cx="176" cy="262" r="0.8"/>
    <circle cx="278" cy="222" r="0.7"/>
    <circle cx="120" cy="292" r="0.7"/>
    <circle cx="216" cy="28" r="0.7"/>
  </g>
</svg>
